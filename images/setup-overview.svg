<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="760" height="408" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#111827">One NAS serves the library, backups and a VM on the local network</text>
<g fill="none" stroke="#6b7280" stroke-width="1.25"><path d="M240 124H272"/><path d="M240 268H272"/><path d="M368 124H416"/><path d="M368 268H416"/><path d="M368 340H416"/></g>
<rect x="272" y="96" width="96" height="272" rx="8" fill="#eef2f7" stroke="#6b7280" stroke-width="1.25"/>
<text x="320" y="226" text-anchor="middle" font-weight="600" fill="#111827"><tspan x="320">Local</tspan><tspan x="320" dy="18">network</tspan></text>
<rect x="24" y="96" width="216" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
<text x="36" y="120" font-weight="600" fill="#111827">Kindle, phone or PC</text>
<text x="36" y="136" font-size="11.5" fill="#4b5563">Opens the library by its IP</text>
<rect x="24" y="232" width="216" height="72" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
<text x="36" y="256" font-weight="600" fill="#111827">Windows laptop</text>
<text x="36" y="272" font-size="11.5" fill="#4b5563">Manages the NAS over SSH</text>
<text x="36" y="288" font-size="11.5" fill="#4b5563">Backs up to drive D: (iSCSI)</text>
<rect x="400" y="56" width="336" height="328" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/>
<text x="416" y="82" font-weight="600" fill="#111827">XigmaNAS on a Dell Latitude E4310</text>
<rect x="416" y="96" width="304" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
<text x="428" y="120" font-weight="600" fill="#111827">Library website (index.php)</text>
<text x="428" y="136" font-size="11.5" fill="#4b5563">PHP page to browse and download books</text>
<rect x="416" y="168" width="304" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
<text x="428" y="192" font-weight="600" fill="#111827">Storage pools</text>
<text x="428" y="208" font-size="11.5" fill="#4b5563">Root pool 53.15 GB, data pool 442.38 GB</text>
<rect x="416" y="240" width="304" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
<text x="428" y="264" font-weight="600" fill="#111827">iSCSI target</text>
<text x="428" y="280" font-size="11.5" fill="#4b5563">Gives the laptop a 379 GB backup drive</text>
<rect x="416" y="312" width="304" height="56" rx="8" fill="none" stroke="#6b7280" stroke-width="1.25"/>
<text x="428" y="336" font-weight="600" fill="#111827">Ubuntu Server VM (in progress)</text>
<text x="428" y="352" font-size="11.5" fill="#4b5563">Bridged network, has its own IP</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
